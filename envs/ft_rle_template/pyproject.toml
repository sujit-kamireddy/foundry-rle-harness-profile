[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ft-rle-template"
version = "0.1.0"
description = "Frontier Tuning world as a Foundry RLE environment"
requires-python = ">=3.10"
dependencies = [
    "openenv>=0.3.1",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "uvicorn>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
server = "ft_rle_template.server.app:main"
render-harness-profile = "ft_rle_template.profile:main"

[tool.setuptools]
include-package-data = true
packages = [
    "ft_rle_template",
    "ft_rle_template.graders",
    "ft_rle_template.server",
    "ft_rle_template.tcaas",
    "ft_rle_template.tools",
]
package-dir = { "ft_rle_template" = ".", "ft_rle_template.graders" = "graders", "ft_rle_template.server" = "server", "ft_rle_template.tcaas" = "tcaas", "ft_rle_template.tools" = "tools" }

[tool.setuptools.package-data]
"ft_rle_template.tcaas" = ["*.json"]
